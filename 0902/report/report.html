<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>자기소개 페이지</title>
<style>
body { background-color : linen; color : green;
margin-left : 40px; margin-right : 40px;}
h3 { text-align : center; color : darkred; cursor: pointer;}
hr { height : 5px; border : solid grey;
background-color : grey }
span { color: blue; font-size: 20px; }
div { text-align: center; }
img { max-width: 200px; margin-bottom: 15px; }
</style>
<script>
function show() { // <img>에 이미지 달기, myphoto.png로 된 이미지 파일로 사용가능
document.getElementById("fig").src = "myphoto.png"
}
function hide() { // <img>에 이미지 제거
document.getElementById("fig").src = "";
}
</script>
</head>
<body>
<h3 onmouseover="show()" onmouseout="hide()">
홍길동</h3>
<hr>
<div><img id="fig" src=""></div>
안녕하세요! 저는 웹 개발을 배우고 있는 <span>홍길동</span>입니다. 
주로 <span>프론트엔드 개발</span>에 관심이 많으며, 멋진 웹 페이지를 만드는 것을 좋아합니다.
</body>
</html>
